<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Абстрактная игровая сцена">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f2b"/>
      <stop offset="0.55" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#b6ff3c" stop-opacity=".30"/>
      <stop offset="0.5" stop-color="#4fd1e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4fd1e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ff8a"/>
      <stop offset="1" stop-color="#7bd94e"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253b49"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0e14" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="420" rx="430" ry="330" fill="url(#glow)"/>

  <!-- сетка -->
  <g stroke="#9fe8ff" stroke-opacity=".10" stroke-width="1">
    <path d="M0 620H1200M0 680H1200M0 750H1200M0 830H1200"/>
    <path d="M600 600L60 900M600 600L200 900M600 600L340 900M600 600L480 900M600 600L720 900M600 600L860 900M600 600L1000 900M600 600L1140 900"/>
  </g>
  <rect y="560" width="1200" height="340" fill="url(#fade)"/>

  <!-- платформа -->
  <g>
    <ellipse cx="600" cy="720" rx="230" ry="46" fill="#000" opacity=".45" filter="url(#blur)"/>
    <path d="M420 610 L600 550 L780 610 L600 675 Z" fill="url(#platform)" stroke="#6ee7f0" stroke-opacity=".35"/>
    <path d="M420 610 L600 675 L600 710 L420 645 Z" fill="#101923" stroke="#6ee7f0" stroke-opacity=".18"/>
    <path d="M780 610 L600 675 L600 710 L780 645 Z" fill="#0b121a" stroke="#6ee7f0" stroke-opacity=".18"/>
    <path d="M600 550 L780 610 L600 675 L420 610 Z" fill="none" stroke="#b6ff3c" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <!-- персонаж-куб -->
  <g transform="translate(560 380)">
    <ellipse cx="40" cy="185" rx="62" ry="14" fill="#b6ff3c" opacity=".18" filter="url(#blur)"/>
    <path d="M0 40 L40 12 L80 40 L40 68 Z" fill="#ecffc4"/>
    <path d="M0 40 L40 68 L40 150 L0 122 Z" fill="#9ada63"/>
    <path d="M80 40 L40 68 L40 150 L80 122 Z" fill="url(#cube)"/>
    <circle cx="60" cy="96" r="5" fill="#0d1b12" opacity=".8"/>
    <circle cx="26" cy="96" r="5" fill="#0d1b12" opacity=".8"/>
  </g>

  <!-- частицы -->
  <g fill="#b6ff3c">
    <circle cx="290" cy="250" r="3" opacity=".8"/><circle cx="350" cy="180" r="2" opacity=".5"/>
    <circle cx="890" cy="230" r="4" opacity=".7"/><circle cx="960" cy="330" r="2" opacity=".5"/>
    <circle cx="230" cy="430" r="2" opacity=".6"/><circle cx="1010" cy="480" r="3" opacity=".6"/>
  </g>
  <g fill="#4fd1e5">
    <circle cx="820" cy="160" r="2" opacity=".8"/><circle cx="430" cy="290" r="2" opacity=".6"/>
    <circle cx="180" cy="560" r="3" opacity=".5"/><circle cx="1060" cy="600" r="2" opacity=".7"/>
  </g>

  <!-- HUD -->
  <g font-family="monospace" fill="#cfe3f2">
    <text x="48" y="70" font-size="17" letter-spacing="3" opacity=".75">SCENE / PREVIEW</text>
    <text x="1000" y="70" font-size="17" fill="#b6ff3c">60 FPS</text>
    <rect x="48" y="92" width="150" height="4" rx="2" fill="#ffffff" opacity=".12"/>
    <rect x="48" y="92" width="108" height="4" rx="2" fill="#b6ff3c" opacity=".8"/>
  </g>
  <g transform="translate(48 780)">
    <rect width="180" height="34" rx="8" fill="#0d141c" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="14" y="22" font-family="monospace" font-size="13" fill="#93a4b8">Player / Idle</text>
  </g>
</svg>
